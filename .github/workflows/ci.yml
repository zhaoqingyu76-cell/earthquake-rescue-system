name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libs for OpenCV
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0
      - name: Syntax check (Python)
        run: python -m py_compile software/*.py software/tools/*.py software/demo/*.py
      - name: Install deps
        run: pip install -r software/requirements.txt
      - name: Create local config from example
        # config.py 是本地文件（存真实 IP），被 git 忽略，CI 检出里没有；
        # 用占位符版生成一份，smoke test 和单测才能 import config
        run: cp software/config.example.py software/config.py
      - name: Smoke test (import core modules without camera)
        run: python -c "import sys; sys.path.insert(0, 'software'); import config, decision, deepseek, car; print('decision:', decision.decide(None, []).action)"
      - name: Run tests
        run: |
          pip install pytest
          python -m pytest software/tests -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v1
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Create local firmware config from example
        # config.h 是本地文件（存引脚参数），被 git 忽略，CI 检出里没有；
        # 用占位符版生成一份，否则 #include "config.h" 编译失败
        run: cp firmware/SmartCar_System/config.example.h firmware/SmartCar_System/config.h
      - name: Compile firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/SmartCar_System/SmartCar_System.ino
